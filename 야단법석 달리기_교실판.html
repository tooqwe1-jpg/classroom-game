<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>야단법석 달리기 · 교실판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel:#f5f3ee; --line:#dedbd3; --ink:#1b1b1f; --dim:#77737f;
  --pu:#b45fc4; --or:#f2a33a; --gr:#4fa34a; --bl:#5a8ee0; --re:#e8563f; --ye:#ffc400; --pk:#ff5c9e;
}
*{box-sizing:border-box}
b,strong,th,h1,h2,h3,h4,h5,h6{font-weight:400 !important}
*{font-synthesis:none}
html,body{font-synthesis:none;margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
button{font-family:inherit;cursor:pointer;border:0}
h1,h2,h3,.han{font-family:'Jua',sans-serif;font-weight:400}
.rainbow{background:linear-gradient(90deg,var(--pk),var(--or),#e0b000,var(--gr),var(--bl),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:var(--ink);color:#fff;padding:.55em 1.1em;border-radius:999px;font-size:1.05rem;transition:transform .08s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn.pk{background:var(--pk)}.btn.ye{background:var(--ye);color:#1b1b1f}.btn.bl{background:var(--bl)}.btn.gr{background:var(--gr)}.btn.re{background:var(--re)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.sm{font-size:.9rem;padding:.4em .85em}
.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 60px;zoom:var(--z,1)}
.screen-title{font-size:clamp(34px,5vw,64px);margin:0 0 6px;line-height:1.1}
.sub{color:var(--dim);margin:0 0 24px;font-size:1.1rem}
.sec{background:var(--panel);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.sec h3{margin:0 0 12px;font-size:1.35rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{padding:.5em 1em;border-radius:999px;background:#fff;color:var(--ink);font-size:1.05rem;border:2px solid var(--line)}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.teamname{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:.45em .7em;font:inherit;font-size:1rem;width:150px}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pool label{display:flex;gap:8px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px;cursor:pointer;border:2px solid var(--line);opacity:.45}
.pool label.on{border-color:var(--gr);opacity:1}
.pool input{display:none}
.pool .e{font-size:1.5rem}
.note{color:var(--dim);font-size:.95rem;margin-top:8px}
.foot{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.num{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-family:'Jua';border:2px solid #111;text-shadow:0 0 3px #000,0 0 2px #000}
.mini{width:1.5em;height:1.5em;font-size:.8em;margin-right:.25em;vertical-align:.1em}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:16px}
.card{position:relative;background:#fff;color:#1a1a1a;border-radius:18px;padding:10px;border:6px solid #111;cursor:pointer;transition:transform .12s}
.card:hover{transform:translateY(-4px)}
.card .art{border-radius:12px;height:110px;display:flex;align-items:center;justify-content:center;font-size:72px}
.card .nm{font-family:'Jua';font-size:1.7rem;text-align:center;margin:8px 0 6px}
.card .tx{font-size:1rem;line-height:1.45;text-align:center;background:#f5f2ec;border-radius:12px;padding:10px;min-height:96px;display:flex;align-items:center;justify-content:center}
.card.sel{transform:translateY(-6px) scale(1.02);box-shadow:0 0 0 5px var(--bl)}
.card .own{position:absolute;top:-16px;right:-10px;padding:.35em .9em;border-radius:999px;font-size:1.15rem;color:#fff;border:3px solid #111;text-shadow:0 0 3px #000}
.assignbar{position:sticky;bottom:0;background:rgba(255,255,255,.97);padding:14px 0;margin-top:18px;border-top:2px solid var(--line)}

/* order */
.dicerow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:24px 0}
.dbox{background:var(--panel);border-radius:18px;padding:14px 18px;text-align:center;min-width:160px;border:4px solid transparent;transition:transform .1s}
.dbox.click{cursor:pointer}.dbox.click:hover{transform:translateY(-3px);border-color:var(--line)}
.dbox.win{border-color:var(--ye);background:#fff7d6}
.die{display:inline-flex;width:84px;height:84px;border-radius:18px;background:#fff;color:#111;font-family:'Jua';font-size:56px;align-items:center;justify-content:center;margin:10px 0;border:3px solid #111;box-shadow:0 5px 0 #111}
.die.q{color:#bbb}
.die.dup{opacity:.35;text-decoration:line-through}
.die.rolling{animation:shake .12s infinite}
.ordtag{display:inline-block;margin-top:4px;background:var(--ink);color:#fff;border-radius:999px;padding:.15em .8em;font-size:1rem}
.seqline{font-size:1.4rem;min-height:2em}

/* race */
.wrap .card .tx{font-size:1.05rem}
#race{height:100vh;display:flex;flex-direction:column;padding:1.2vh 1.4vw;gap:1.4vh}
.top{display:flex;align-items:center;gap:1.2vh;height:7.4vh;min-height:46px}
.top .btn.sm{font-size:3.1vh;padding:.8vh 1.8vh;flex:none;white-space:nowrap}
.top h1{font-size:4.8vh;margin:0}
.top .tk{color:var(--dim);font-size:2.6vh;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.board{display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(4,1fr);gap:.35vh;height:57vh;background:#111;border-radius:3vh;padding:.35vh;box-shadow:0 0 0 .5vh #fff,0 0 0 1.1vh #111}
.cell{position:relative;overflow:hidden;display:flex;flex-direction:column}
.cell.c-tl{border-top-left-radius:2.7vh}.cell.c-tr{border-top-right-radius:2.7vh}.cell.c-br{border-bottom-right-radius:2.7vh}.cell.c-bl{border-bottom-left-radius:2.7vh}
.cell .no{position:absolute;left:.7vh;top:.3vh;font-family:'Jua';font-size:2.8vh;color:#4a4656;text-shadow:none}
.cell .badge{position:absolute;left:0;right:0;bottom:0;height:4.8vh;display:flex;align-items:center;justify-content:center;gap:.5vh;font-family:'Jua';font-size:2.7vh;color:#fff;white-space:nowrap}
.cell.fw .badge{background:#9fd49a;color:#1d4a26}.cell.bk .badge{background:#f4a9a3;color:#7a1d1d}.cell.fl .badge{background:#f6c391;color:#6e3606}.cell.st .badge{background:#f6dd82;color:#5a4300}
.cell.curcell{box-shadow:inset 0 0 0 .8vh #f5a400}
.cell.start{background:#c4d9f5}
.cell.start .no{font-size:3.4vh}
.toks{position:relative;flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:.4vh;padding:2.8vh .3vh 5vh}
.tok{width:var(--ts,5.8vh);height:var(--ts,5.8vh);flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--tf,3.7vh);font-family:'Jua';color:#fff;text-shadow:0 0 4px #000,0 0 2px #000;border:.5vh solid #111;position:relative;box-shadow:0 .4vh 0 rgba(0,0,0,.35)}
.tok.fallen{transform:rotate(90deg);filter:grayscale(.45)}
.tok.fallen::after{content:'💫';position:absolute;top:-2.2vh;font-size:2.2vh;transform:rotate(-90deg);text-shadow:none}
.tok.cur{box-shadow:0 0 0 .4vh #fff,0 0 0 .9vh #f5a400,0 0 2.4vh .8vh rgba(245,164,0,.55);animation:pulse .9s ease-in-out infinite;z-index:4}
.tok.cur::before{content:'▼';position:absolute;top:-3.4vh;font-size:3vh;color:#ffc400;-webkit-text-stroke:.35vh #111;paint-order:stroke fill;text-shadow:none;animation:bob .6s ease-in-out infinite alternate}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-.9vh)}}
.tok.hop{animation:hop .34s ease-out;z-index:3}
.tok.hit{animation:hit .45s ease-in-out 3;z-index:3}
@keyframes quake{0%,100%{transform:translate(0,0)}10%{transform:translate(-1.6vh,.8vh) rotate(-.5deg)}20%{transform:translate(1.6vh,-.8vh) rotate(.5deg)}30%{transform:translate(-1.4vh,-.6vh)}40%{transform:translate(1.4vh,.6vh)}50%{transform:translate(-1vh,.4vh) rotate(-.3deg)}60%{transform:translate(1vh,-.4vh) rotate(.3deg)}70%{transform:translate(-.6vh,.2vh)}80%{transform:translate(.6vh,-.2vh)}90%{transform:translate(-.3vh,0)}}
body.quake #race{animation:quake .7s ease-in-out 1;animation-delay:.15s}
@keyframes hop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-2.8vh) scale(1.2)}100%{transform:translateY(0) scale(1)}}
@keyframes hit{0%,100%{transform:scale(1)}25%{transform:scale(1.35) rotate(-14deg)}75%{transform:scale(1.35) rotate(14deg)}}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.finish{grid-row:1/4;grid-column:1;background:#fff;border-top-left-radius:2.7vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;position:relative;overflow:hidden}
.finish::before{content:'';position:absolute;left:0;right:0;bottom:0;height:3vh;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/3vh 3vh}
.finish .lbl{font-family:'Jua';font-size:4.6vh;writing-mode:vertical-rl;letter-spacing:.6vh}
.finish .tro{font-size:5vh}
.center{grid-row:2/4;grid-column:2/15;background:#fff;display:flex;align-items:center;justify-content:center;padding:1.5vh 3vh;min-height:0}
#prompt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;text-align:center;width:100%}
#prompt .who{font-size:4.2vh;font-family:'Jua'}
#prompt .who .num{width:4.6vh;height:4.6vh;font-size:2.8vh;margin-right:.6vh;vertical-align:middle}
#prompt .msg{font-size:3.8vh;line-height:1.35}
#prompt .opts{display:flex;flex-wrap:wrap;gap:1vh;justify-content:center}
#prompt .opts .btn{font-size:3.4vh;padding:.9vh 2.2vh}
#prompt .bigdie{display:inline-flex;width:15vh;height:15vh;border-radius:3vh;background:#fff;border:.6vh solid #111;box-shadow:0 1vh 0 #111;align-items:center;justify-content:center;font-family:'Jua';font-size:11vh}
#prompt .bigdie.rolling{animation:shake .12s infinite}
#prompt .idle{color:#55525c;font-size:3.2vh}
#prompt .turnbig{font-family:'Jua';font-size:6vh}
.teams{display:flex;gap:.8vw;flex:1;min-height:0}
.tcard{flex:1;background:var(--panel);border-radius:1.6vh;padding:1vh 1vw;border:.45vh solid transparent;display:flex;flex-direction:column;gap:.4vh;min-width:0;overflow:hidden}
.tcard.cur{border-color:#f5a400;background:#fff1c2;transform:translateY(-.6vh)}
.tcard .now{background:#f5a400;color:#fff;border-radius:999px;padding:.1em .6em;font-size:2.3vh;white-space:nowrap}
.tcard .tn{font-family:'Jua';font-size:3.4vh;display:flex;align-items:center;gap:.7vh}
.tcard .tn .num{width:4.6vh;height:4.6vh;font-size:2.9vh}
.tcard .sc{margin-left:auto;font-size:4.6vh;color:var(--re);font-family:'Jua'}
.tcard .sc small{font-size:2.4vh;color:var(--dim)}
.tcard .cn{font-size:3.2vh;font-family:'Jua'}
.tcard .ct{font-size:2.4vh;color:#2f2d35;line-height:1.3;flex:1;overflow:auto}
.tcard .st{font-size:2.6vh;color:var(--dim)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60}
.modal .box{zoom:var(--z,1);background:#fff;border-radius:20px;padding:22px 26px;max-width:760px;width:92%;border:4px solid #111}
.modal h3{margin:0 0 12px;font-size:1.6rem}
.adj{display:grid;grid-template-columns:1fr auto auto auto auto auto;gap:8px 8px;align-items:center;margin:10px 0}

/* 효과 배너 */
#fx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40}
#fx .bg{position:absolute;inset:0;background:radial-gradient(circle,var(--c) 0%,transparent 70%);opacity:.28;animation:flash .5s ease-out}
#fx .fxbox{position:relative;background:#fff;border:1.1vh solid var(--c);border-radius:3.5vh;padding:3vh 6vh 3.5vh;text-align:center;box-shadow:0 2vh 6vh rgba(0,0,0,.3);animation:pop .5s cubic-bezier(.2,1.7,.4,1) both;max-width:76vw}
#fx .fxe{font-size:15vh;line-height:1.1;animation:wig .5s ease-in-out infinite alternate}
#fx .fxw{font-size:4.6vh;font-family:'Jua';display:flex;align-items:center;justify-content:center;gap:1vh}
#fx .fxw .num{width:5vh;height:5vh;font-size:3vh}
#fx .fxm{font-size:5.6vh;letter-spacing:.02em;font-family:'Jua';margin-top:1.2vh;line-height:1.25}
#fx .fxm .num{width:5vh;height:5vh;font-size:3vh;vertical-align:.4vh}
#fx .small .fxe{font-size:10vh}#fx .fxf{font-size:.62em;color:#b4b4b4;margin-bottom:.4vh}#fx .fxa{color:#111}#fx .fxa b{color:#111 !important}#fx .small .fxm{font-size:5vh}
@keyframes pop{0%{transform:scale(.15) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes wig{0%{transform:rotate(-10deg) scale(1)}100%{transform:rotate(10deg) scale(1.12)}}
@keyframes flash{0%{opacity:.8}100%{opacity:.28}}

/* result */
.podium{display:flex;flex-direction:column;gap:12px;max-width:820px;margin:20px auto}
.prow{display:flex;align-items:center;gap:16px;background:var(--panel);border-radius:18px;padding:14px 22px;font-size:1.6rem;border:4px solid transparent}
.prow .rk{font-family:'Jua';font-size:2.3rem;width:110px;text-align:left}
.prow.r1{border-color:var(--ye);background:#fff7d6}
.prow .pts{font-family:'Jua';font-size:2.4rem;color:var(--re)}
.prow .num{width:2.2em;height:2.2em;font-size:.9em}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<div id="modal"></div>
<script>
function setZ(){document.documentElement.style.setProperty('--z',Math.max(1,Math.min(innerWidth/1920,innerHeight/1080)*1.7).toFixed(3))}setZ();addEventListener('resize',setZ);
/* ===================== 데이터 ===================== */
const FINISH = 30;
const SQ = ['#e3d2ee','#fbe6c2','#d3e9cd','#d0e1f6','#f7d3cd'];
const TEAM_COLORS = ['#ff4f7b','#3d7eff','#f5b400','#14b8a6','#a855f7','#ff7a1a'];
const CARDS = [
 {id:'strict',name:'엄근진',e:'🧐',bg:'#5a8ee0',t:'다른 선수들은 결승선을 통과하려면 딱 필요한 만큼 정확히 이동해야 해. 그보다 조금이라도 많이 가야 한다면 아예 이동하지 않아.'},
 {id:'breaker',name:'커플 브레이커',e:'💔',bg:'#4fa34a',t:'나는 기본 이동을 하기 전에, 선수가 딱 2명만 있는 아무 칸으로 워프할 수 있어.'},
 {id:'tall',name:'키다리',e:'🦒',bg:'#4fa34a',t:'나는 기본 이동에서 주사위 굴리기를 건너뛰는 조건으로 5칸을 이동할 수 있어.'},
 {id:'hypno',name:'최면술사',e:'🌀',bg:'#ffc400',t:'나는 기본 이동을 하기 전에, 다른 선수 1명을 내 칸으로 워프시킬 수 있어.'},
 {id:'worm',name:'꿈틀벌레',e:'🐛',bg:'#e8563f',t:'다른 선수가 기본 이동에서 주사위 결과가 1이 나오면, 그 선수는 기본 이동을 건너뛰고 내가 1칸 이동해.'},
 {id:'banana',name:'바나나',e:'🍌',bg:'#ff5c9e',t:'나는 나를 지나쳐 간 선수들을 모두 넘어뜨려.'},
 {id:'yam',name:'얌생이',e:'🐶',bg:'#ff5c9e',t:'다른 선수의 능력이 발동될 때마다, 나는 1칸 이동해.'},
 {id:'booer',name:'야유꾼',e:'😝',bg:'#4fa34a',t:'누구든 자기 차례를 시작한 칸으로부터 1칸 이내에서 차례를 마쳤다면, 나는 2칸 이동해.'},
 {id:'servant',name:'시종',e:'🙇',bg:'#e8563f',t:'다른 선수가 기본 이동에서 주사위 결과가 6이 나오면, 그 선수가 이동하기 전에 내가 먼저 2칸 이동해.'},
 {id:'rabbit',name:'토끼',e:'🐰',bg:'#f2a33a',t:'나는 기본 이동에 +2를 받아. 내가 차례를 시작할 때, 나 혼자 선두라면 기본 이동을 건너뛰어.'},
 {id:'coach',name:'감독',e:'📢',bg:'#b45fc4',t:'나를 포함해서 내 칸에 있는 모든 선수들은 기본 이동에 +1을 받아.'},
 {id:'shoe',name:'헌신짝',e:'👟',bg:'#e8563f',t:'나는 기본 이동에서 주사위 굴리기를 건너뛰는 조건으로 다른 선수 1명과 위치를 서로 바꿀 수 있어.'},
 {id:'sucker',name:'빨판물고기',e:'🐟',bg:'#5a8ee0',t:'내 칸에 있는 선수가 이동할 때, 나도 그 선수가 도착하는 칸으로 이동할 수 있어.'},
 {id:'magician',name:'마술사',e:'🎩',bg:'#f2a33a',t:'나는 기본 이동에서 주사위를 2번까지 다시 굴릴 수 있어.'},
 {id:'captain',name:'일타선장',e:'⚓',bg:'#b45fc4',t:'누구든 기본 이동에서 주사위 결과가 1이 나올 때마다, 내가 바로 다음 차례가 돼.'},
 {id:'romantic',name:'로맨티시스트',e:'💘',bg:'#b45fc4',t:'누구든 다른 선수가 딱 1명만 있는 칸에 멈출 때마다, 나는 2칸 이동해.'},
 {id:'centaur',name:'켄타우로스',e:'🐎',bg:'#b45fc4',t:'내가 다른 선수들을 지나쳐 가면, 그 선수들은 뒤쪽으로 2칸 이동해.'},
 {id:'gum',name:'껌딱지',e:'🍬',bg:'#f2a33a',t:'다른 선수들은 모두 기본 이동에 -1을 받아.'},
 {id:'frog',name:'펄쩍두꺼비',e:'🐸',bg:'#f2a33a',t:'나는 이동하는 동안 다른 선수들이 있는 칸을 건너뛰어.'},
 {id:'rocket',name:'로켓 박사',e:'🚀',bg:'#ff5c9e',t:'나는 기본 이동을 할 때, 주사위 결과의 2배만큼 이동할 수 있어. 그렇게 하면, 나는 넘어져.'},
];
const CARD = Object.fromEntries(CARDS.map(c=>[c.id,c]));
const HARD = {1:{t:'star'},5:{t:'fall'},7:{t:'arrow',n:3},11:{t:'arrow',n:1},13:{t:'star'},16:{t:'arrow',n:-4},17:{t:'fall'},23:{t:'arrow',n:2},24:{t:'arrow',n:-2},26:{t:'fall'}};
const lapPoints = order=>Math.max(10,100-10*(order-1));   // 바퀴마다 100, 90, 80 …

/* ===================== 설정 ===================== */
const cfg = { teams:4, names:['1모둠','2모둠','3모둠','4모둠','5모둠','6모둠'], track:'easy',laps:'repeat', star:'bonus', reveal:4, speed:1.6, sound:true, pool:new Set(CARDS.map(c=>c.id)) };
try{ const s=JSON.parse(localStorage.getItem('yadan-cfg2')||'null'); if(s){ if(s.star==='plus2')s.star='bonus'; Object.assign(cfg,s,{pool:new Set((s.pool||[]).filter(id=>CARD[id]))}); cfg.speed=1.6; if(!cfg.pool.size) CARDS.forEach(c=>cfg.pool.add(c.id)); } }catch(e){}

const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ===================== 사운드 (Web Audio 합성) ===================== */
const SND={ctx:null};
function ac(){ if(!SND.ctx){ try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(SND.ctx.state==='suspended') SND.ctx.resume(); return SND.ctx; }
function tone(f,d,{type='sine',vol=.2,at=0,slide=null}={}){
  if(!cfg.sound) return; const c=ac(); if(!c) return;
  const t=c.currentTime+at, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.03);
}
function noise(d,{vol=.2,at=0,freq=1500}={}){
  if(!cfg.sound) return; const c=ac(); if(!c) return;
  const t=c.currentTime+at, len=Math.floor(c.sampleRate*d), buf=c.createBuffer(1,len,c.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
  const s=c.createBufferSource(), bp=c.createBiquadFilter(), g=c.createGain();
  s.buffer=buf; bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=1.2;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+d);
  s.connect(bp).connect(g).connect(c.destination); s.start(t);
}
const sfx={
  click(){ tone(700,.06,{type:'square',vol:.05}); },
  dice(n=10){ for(let i=0;i<n;i++) noise(.05,{at:i*.075,vol:.35,freq:1800+Math.random()*2200}); },
  diceEnd(){ tone(880,.12,{type:'triangle',vol:.22}); tone(1320,.25,{type:'triangle',vol:.18,at:.09}); },
  step(i){ tone(420+Math.min(i,12)*45,.09,{type:'triangle',vol:.2}); noise(.03,{vol:.12,freq:3500}); },
  turn(){ tone(660,.1,{vol:.15}); tone(990,.16,{vol:.15,at:.1}); },
  ability(){ tone(180,.4,{type:'sawtooth',vol:.12,slide:1400}); [523,659,784,1047].forEach((f,i)=>tone(f,.28,{type:'square',vol:.07,at:.28+i*.06})); },
  fall(){ tone(500,.55,{type:'sawtooth',vol:.15,slide:70}); noise(.25,{vol:.35,at:.4,freq:250}); },
  warp(){ tone(250,.45,{vol:.25,slide:2000}); tone(500,.45,{vol:.12,slide:4000,at:.05}); },
  arrow(){ tone(500,.28,{type:'triangle',vol:.2,slide:1300}); },
  back(){ tone(1100,.32,{type:'triangle',vol:.2,slide:280}); },
  lap(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,{type:'square',vol:.1,at:i*.11})); tone(1047,.7,{type:'triangle',vol:.2,at:.48}); tone(1319,.7,{type:'triangle',vol:.12,at:.48}); },
  start(){ [0,.55,1.1].forEach(a=>tone(440,.2,{type:'square',vol:.12,at:a})); tone(880,.7,{type:'square',vol:.15,at:1.65}); },
  end(){ [392,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i===6?.9:.2,{type:'square',vol:.1,at:i*.16})); },
};

/* ===================== 2. 선수 영입 ===================== */

  cfg.names = cfg.names.map((s,i)=>s.trim()||`${i+1}모둠`);

  D = {cards:shuffle([...cfg.pool]).slice(0,Math.max(cfg.teams,cfg.reveal)), own:{}, sel:null};

}
function cardHTML(id,extra=''){ const c=CARD[id]; return `<div class="art" style="background:${c.bg}">${c.e}</div><div class="nm">${c.name}</div><div class="tx">${c.t}</div>${extra}`; }
function showDraft(){

function draftClick(id){ if(D.own[id]!==undefined){ delete D.own[id]; D.sel=null; } else D.sel=D.sel===id?null:id; showDraft(); }
function assign(t){ if(!D.sel) return; D.own[D.sel]=t; D.sel=null; showDraft(); }
function teamCard(i){ return Object.keys(D.own).find(k=>D.own[k]===i); }

/* ===================== 3. 출발 순서 ===================== */
let ORD=null;
function showOrder(){ ORD={mode:'dice',vals:null,cnt:null,starter:null,seq:null,manual:[],rolling:false,msg:''}; renderOrder(); }
function renderOrder(){
  const n=cfg.teams, O=ORD;
  const boxes=Array.from({length:n},(_,i)=>{
    const c=CARD[teamCard(i)];
    let mid;
    if(O.mode==='dice'){
      const v=O.vals?O.vals[i]:'?';
      mid=`<div class="die ${O.vals?'':'q'} ${O.rolling?'rolling':''} ${O.cnt&&!O.rolling&&O.cnt[v]>1?'dup':''}" id="die${i}">${v}</div>`;
    }else{
      const k=O.manual.indexOf(i);
      mid=`<div class="die ${k<0?'q':''}">${k<0?'?':k+1}</div>`;
    }
    const win=O.mode==='dice'?(O.starter===i&&!O.rolling):(O.manual[0]===i);
    const k=O.seq?O.seq.indexOf(i):-1;
    return `<div class="dbox ${win?'win':''} ${O.mode==='manual'?'click':''}" ${O.mode==='manual'?`onclick="manualPick(${i})"`:''}>

      ${k>=0?`<div class="ordtag">${k+1}번째</div>`:''}</div>`;}).join('');
  const seqTxt=O.seq?O.seq.map(i=>`<b style="color:${tcol(i)}">${esc(cfg.names[i])}</b>`).join(' → ')+' → …':'';
  $('#app').innerHTML=`
  <div class="wrap" style="text-align:center">
    <h1 class="screen-title rainbow">출발 순서 정하기</h1>
    <div class="row" style="justify-content:center;margin:10px 0 0">
      <button class="chip ${O.mode==='dice'?'on':''}" onclick="ORD.mode='dice';ORD.seq=ORD.vals&&ORD.starter!==null?diceSeq():null;renderOrder()">🎲 주사위로 정하기</button>
      <button class="chip ${O.mode==='manual'?'on':''}" onclick="ORD.mode='manual';ORD.seq=ORD.manual.length===cfg.teams?[...ORD.manual]:null;renderOrder()">✋ 직접 정하기</button>
    </div>
    <p class="sub" style="margin:14px 0 0">${O.mode==='dice'?'다른 모둠과 겹치지 않은 값 중 가장 높은 모둠이 먼저! 그다음은 모둠 번호 순서대로.':'첫 번째로 출발할 모둠부터 차례대로 누르세요.'}</p>
    <div class="dicerow">${boxes}</div>
    <div class="seqline">${O.msg?`<div style="color:var(--re)">${O.msg}</div>`:''}${seqTxt}</div>
    <div class="row" style="justify-content:center;margin-top:16px">
      <button class="btn ghost" onclick="showDraft()">← 영입으로</button>
      ${O.mode==='dice'?`<button class="btn ye" style="font-size:1.25rem" ${O.rolling?'disabled':''} onclick="rollOrder()">🎲 ${O.vals?'다시 굴리기':'주사위 굴리기'}</button>`
        :`<button class="btn ghost" onclick="ORD.manual=[];ORD.seq=null;renderOrder()">초기화</button>`}
      <button class="btn pk" style="font-size:1.25rem" ${O.seq&&!O.rolling?'':'disabled'} onclick="startRace()">경주 시작! 🏃</button>
    </div>
  </div>`;
}
function diceSeq(){ const n=cfg.teams; return Array.from({length:n},(_,k)=>(ORD.starter+k)%n); }
async function rollOrder(){
  const n=cfg.teams; ORD.msg=''; ORD.seq=null; ORD.starter=null;
  while(true){
    ORD.rolling=true; ORD.cnt=null; ORD.vals=Array.from({length:n},d6); renderOrder();
    sfx.dice(14);
    for(let k=0;k<14;k++){ for(let i=0;i<n;i++){ const el=$('#die'+i); if(el) el.textContent=d6(); } await pause(75); }
    const v=Array.from({length:n},d6), cnt={}; v.forEach(x=>cnt[x]=(cnt[x]||0)+1);
    ORD.vals=v; ORD.cnt=cnt; ORD.rolling=false; sfx.diceEnd();
    const uniq=v.map((x,i)=>cnt[x]===1?i:-1).filter(i=>i>=0);
    if(uniq.length){ ORD.starter=uniq.reduce((a,b)=>v[b]>v[a]?b:a); ORD.seq=diceSeq(); renderOrder(); return; }
    ORD.msg='모두 다른 모둠과 겹쳤어요! 다시 굴립니다…'; renderOrder(); await pause(1300);
  }
}
function manualPick(i){
  const m=ORD.manual, k=m.indexOf(i);
  if(k>=0) m.splice(k,1); else m.push(i);
  ORD.seq=m.length===cfg.teams?[...m]:null;
  renderOrder();
}

/* ===================== 4. 경주 엔진 ===================== */
let G=null, pending=null, ABORT=null, LOOP_ON=false;
class Abort extends Error{ constructor(k){super(k);this.kind=k;} }
const STEP=430, BANNER=1900, SMALL_BANNER=1400;

const R = id=>G.racers[id];
const all = ()=>G.racers.filter(r=>!r.done);   // 완주해서 빠진 선수는 제외(한 바퀴 모드)
const at = (pos,ex)=>all().filter(o=>o!==ex && o.pos===pos);
const tag = r=>`${numBadge(r.id,'mini')}<b style="color:${r.color}">${esc(r.name)}</b>`;
const posName = p=>p===0?'시작 칸':`${p}번 칸`;
function orderFrom(id){ const i=G.seq.indexOf(id); return G.seq.map((_,k)=>R(G.seq[(i+k)%G.seq.length])).filter(r=>!r.done); }
const prog=r=>r.laps*FINISH+r.pos;
function leaders(){ const m=Math.max(...all().map(prog)); return all().filter(r=>prog(r)===m); }

function sleep(ms){
  return new Promise((res,rej)=>{
    if(ABORT) return rej(new Abort(ABORT));
    setTimeout(()=>ABORT?rej(new Abort(ABORT)):res(), ms*cfg.speed);
  });
}
function log(html){ G.log.push(html); G.dirty=true; }

/* ---- 선택 UI ---- */
function whoLine(r){ return r?`<div class="who">${numBadge(r.id)}<span style="color:${r.color}">${esc(r.name)}</span> · ${CARD[r.card].e} ${CARD[r.card].name}</div>`:''; }
function choose(r,msg,options){
  return new Promise((res,rej)=>{
    if(ABORT) return rej(new Abort(ABORT));
    pending={res,rej,options};
    $('#prompt').innerHTML=`${whoLine(r)}<div class="msg">${msg}</div><div class="opts">${options.map((o,i)=>`<button class="btn ${o.cls||''}" onclick="pick(${i})">${o.label}</button>`).join('')}</div>`;
  });
}
function pick(i){ if(!pending) return; const p=pending; pending=null; idlePrompt(); p.res(p.options[i].value); }
function idlePrompt(){ const p=$('#prompt'); if(p) p.innerHTML=''; }
const yesno=(r,msg,y='사용하기',n='안 함')=>choose(r,msg,[{label:y,value:true,cls:'pk'},{label:n,value:false,cls:'ghost'}]);
const pickRacer=(r,msg,list,noneLabel='안 함')=>choose(r,msg,[{label:noneLabel,value:null,cls:'pk'},...list.map(o=>({label:`${numBadge(o.id,'mini')}${esc(o.name)} · ${posName(o.pos)}`,value:o,cls:'ghost'}))]);

async function rollDie(r){
  const opts=[{label:'🎲 굴리기',value:'roll',cls:'ye'},...[1,2,3,4,5,6].map(v=>({label:String(v),value:v,cls:'ghost'}))];
  let v=await choose(r,'주사위를 굴리세요! <span style="color:#b8bcc4;font-size:.45em;font-weight:400">(실물 주사위를 쓰면 숫자 버튼)</span>',opts);
  if(v==='roll'){
    v=d6(); sfx.dice(10);
    $('#prompt').innerHTML=`${whoLine(r)}<div class="bigdie rolling" id="bd">?</div>`;
    for(let k=0;k<10;k++){ const el=$('#bd'); if(el) el.textContent=d6(); await sleep(75); }
  }
  sfx.diceEnd();
  $('#prompt').innerHTML=`${whoLine(r)}<div class="bigdie">${v}</div>`;
  log(`🎲 ${r.name} ${v}`);
  await sleep(1000);
  idlePrompt();
  return v;
}

/* ---- 효과 배너 ---- */
async function banner({r=null,icon=null,title=null,msg='',kind='ability',color=null,hits=[]}){
  (sfx[kind]||sfx.ability)();
  G.hits=new Set(hits.map(o=>o.id)); renderBoard();
  const c=color||(r?r.color:'#111');
  const big=kind==='ability'; const _i=String(msg).indexOf('|'); const fl=_i>=0?String(msg).slice(0,_i):''; const ac=_i>=0?String(msg).slice(_i+1):msg;
  const head=title??(r?`${numBadge(r.id)}<span style="color:${r.color}">${esc(r.name)}</span> · ${CARD[r.card].name}`:'');
  $('#fx').innerHTML=`<div class="bg" style="--c:${c}"></div><div class="fxbox ${big?'':'small'}" style="--c:${c}">
    <div class="fxe">${icon??(r?CARD[r.card].e:'✨')}</div><div class="fxw">${head}</div><div class="fxm">${fl?`<div class="fxf">${fl}</div>`:''}<div class="fxa">${ac}</div></div></div>`;
  const quake=String(ac).includes('😥'); if(quake) document.body.classList.add('quake');
  try{ await sleep(big?BANNER:SMALL_BANNER); }
  finally{ document.body.classList.remove('quake'); $('#fx').innerHTML=''; G.hits=new Set(); renderBoard(); }
}

/* ---- 능력 발동 (얌생이 연동) ---- */
async function act(src,msg,hits=[],kind='ability'){
  log(`${src.name}: ${String(msg).replace('|',' ')}`);
  await banner({r:src,msg,hits,kind});
  const y=all().find(o=>o.card==='yam');
  if(!y || y===src) return;
  if(++G.depth>150) return;
  const sig=src.id+'>'+y.pos;
  if(G.sigs.has(sig)) return;                 // 같은 상황 무한 반복 방지
  G.sigs.add(sig);
  await banner({r:y,msg:'남의 능력 발동! 슬금슬금 1칸',hits:[y]});
  await move(y,1,'ability');
}

/* ---- 한 바퀴 완주 ---- */
async function lapDone(r){
  r.laps++; const k=r.laps;
  G.lapCnt[k]=(G.lapCnt[k]||0)+1;
  const ord=G.lapCnt[k], pts=lapPoints(ord);
  r.score+=pts; r.pos=0; r.fallen=false;
  if(G.single) r.done=true;
  log(`${r.name} ${k}바퀴 ${ord}등 +${pts}`);
  renderBoard();
  await banner({r,icon:'🏁',title:`${numBadge(r.id)}<span style="color:${r.color}">${esc(r.name)}</span> ${G.single?'완주':k+'바퀴 완주'}! (${ord}등)`,msg:G.single?`+${pts}점 → 결승선 통과!`:`+${pts}점 → 다시 시작 칸에서 출발`,kind:'lap',hits:[r]});
}

/* ---- 이동 ---- */
function simulate(r,delta){ // 엄근진 판정용: 결승선 너머까지 몇 칸 가는지
  let left=delta,pos=r.pos;
  while(left>0){ pos++; if(pos<FINISH && r.card==='frog' && at(pos,r).length) continue; left--; }
  return pos;
}
async function move(r,delta,kind){
  if(!delta) return;
  const p0=r.pos, snap=new Map(all().map(o=>[o.id,o.pos]));
  const dir=Math.sign(delta);
  if(dir>0){
    const st=all().find(o=>o.card==='strict' && o!==r);
    if(st && simulate(r,delta)>FINISH){ await act(st,`결승선은 딱 맞게!|${tag(st)} 때문에 ${tag(r)} 이동 취소 😥`,[r]); return; }
  }
  let left=Math.abs(delta), pos=p0, skipped=0, i=0;
  G.hop=r.id;
  while(left>0){
    const np=pos+dir;
    if(np<0) break;                              // 시작 칸보다 뒤로는 못 감
    pos=np;
    if(pos>=FINISH) break;
    if(r.card==='frog' && at(pos,r).length) skipped++; else left--;
    r.pos=pos; renderBoard(); sfx.step(i++); await sleep(STEP);
  }
  G.hop=null;
  if(pos===p0){ renderBoard(); return; }        // 0칸 이동은 이동이 아님
  if(pos>=FINISH){
    await lapDone(r);
    for(const X of all()) if(X!==r && X.card==='sucker' && snap.get(X.id)===p0 && X.pos===p0) await suckerAsk(X,r,FINISH);
    return;
  }
  r.pos=pos; renderBoard();
  for(let k=0;k<skipped;k++) await act(r,'펄쩍!|다른 선수 칸을 건너뜀',[r]);
  await arrive(r,{moved:true,p0,snap,dir});
}
async function warp(r,pos){ r.pos=pos; renderBoard(); await arrive(r,{moved:false}); }

async function babyCheck(r){
  const b=all().find(o=>o.card==='baby');
  if(!b || r.pos===0) return [];
  if(r===b){
    const v=at(b.pos,b); if(!v.length) return [];
    v.forEach(o=>o.pos=b.pos-1); renderBoard();
    await act(b,`비켜! ${v.map(tag).join(' ')} 바로 뒤 칸으로`,v);
    return v;
  }
  if(r.pos===b.pos){ r.pos=b.pos-1; renderBoard(); await act(b,`${tag(r)} 바로 뒤 칸으로 밀어냄!`,[r]); }
  return [];
}
async function trackFx(r){
  if(G.track!=='hard') return;
  const f=HARD[r.pos]; if(!f) return;
  if(f.t==='fall'){ r.fallen=true; log(`${r.name} 넘어짐 칸`); await banner({r,icon:'🦶',title:`${tag(r)} 넘어짐 칸!`,msg:'꽈당! 다음 기본 이동은 쉬어요',kind:'fall',hits:[r],color:'#e8563f'}); }
  else if(f.t==='arrow'){ await banner({r,icon:f.n>0?'⏩':'⏪',title:`${tag(r)} 화살표 칸`,msg:`${f.n>0?'앞으로':'뒤로'} ${Math.abs(f.n)}칸!`,kind:f.n>0?'arrow':'back',hits:[r],color:'#5a8ee0'}); await move(r,f.n,'arrow'); }
  else if(f.t==='star' && G.star==='bonus'){ r.score+=20; sfx.arrow(); await banner({r,icon:'⭐',title:`${tag(r)} 별 칸`,msg:'+20점 보너스!',kind:'arrow',hits:[r],color:'#ffc400'}); }
}
async function arrive(r,ctx){
  // 같은 선수가 한 차례 안에 같은 칸에 또 도착하면(무한 반복 상황) 효과를 더 실행하지 않고 끝냄
  if(++G.depth>300) return;
  const pushed=await babyCheck(r);
  const asig='arr'+r.id+'|'+all().map(o=>o.pos+(o.fallen?'f':'')).join(',');
  if(G.sigs.has(asig)) return;
  G.sigs.add(asig);
  const stopPos=r.pos;
  const mates=at(stopPos,r);
  let passed=[];
  if(ctx.moved && ctx.dir>0) passed=all().filter(o=>o!==r && ctx.snap.get(o.id)>ctx.p0 && o.pos<stopPos);
  await trackFx(r);                                    // ① 트랙 효과
  for(const X of orderFrom(G.cur ?? r.id)){            // ② 현재 차례 → ③ 시계 방향
    const c=X.card;
    if(c==='banana' && passed.includes(X)){ r.fallen=true; await act(X,`미끌!|${tag(X)} 때문에 ${tag(r)} 넘어짐 😥`,[r]); }
    if(c==='centaur' && X===r && passed.length){ await act(X,`뒷발차기!|${tag(X)} 때문에 ${passed.map(tag).join(' ')} 뒤로 2칸 😥`,passed); for(const o of passed) await move(o,-2,'ability'); }
    if(c==='romantic' && mates.length===1){ await act(X,'둘만 있는 칸 발견! 💘|2칸 이동 🎉',[X]); await move(X,2,'ability'); }
    if(c==='sucker' && X!==r && ctx.moved && ctx.snap.get(X.id)===ctx.p0 && X.pos===ctx.p0) await suckerAsk(X,r,stopPos);
  }
  for(const o of pushed) await arrive(o,{moved:false});
}
async function suckerAsk(X,r,dest){
  if(dest===X.pos) return;
  if(await yesno(X,`같은 칸의 ${tag(r)}를 따라 <b>${dest>=FINISH?'결승선':posName(dest)}</b>까지 갈까요?`,'따라가기','안 함')){
    await act(X,`${tag(r)} 따라가기!`,[X]);
    await move(X,(dest>=FINISH?FINISH:dest)-X.pos,'ability');
  }
}

/* ---- 차례 ---- */
async function takeTurn(r){
  G.cur=r.id; G.sigs=new Set(); G.depth=0; G.turnNo++;
  const startPos=r.pos;
  G.log.push(`▶ ${r.name}`);   // 차례 시작은 '변화'로 치지 않음 (되돌리기가 이전 차례로 가도록)
  renderAll(); sfx.turn();
  $('#prompt').innerHTML=`${whoLine(r)}<div class="turnbig" style="color:${r.color}">차례!</div>`;
  await sleep(900);
  let skip=false;

  if(r.card==='rabbit'){ const L=leaders(); if(L.length===1&&L[0]===r){ skip=true; await act(r,'혼자 선두라 낮잠 😴|기본 이동 건너뜀',[r]); } }
  if(r.card==='hypno'){
    const t=all().filter(o=>o!==r && o.pos!==r.pos);
    if(t.length){ const v=await pickRacer(r,'내 칸으로 워프시킬 선수를 고를까요?',t); if(v){ await act(r,`붙어라!|${tag(r)} 때문에 ${tag(v)} 끌려옴 😥`,[v],'warp'); await warp(v,r.pos); } }
  }
  if(r.card==='breaker'){
    const spots=[...new Set(all().map(o=>o.pos))].filter(p=>p!==r.pos && at(p).length===2);
    if(spots.length){
      const p=await choose(r,'선수가 딱 2명 있는 칸으로 워프할까요?',[...spots.map(p=>({label:posName(p),value:p,cls:'pk'})),{label:'안 함',value:null,cls:'ghost'}]);
      if(p!==null){ await act(r,`짝 갈라놓기! 💔|${posName(p)}으로 워프`,[r],'warp'); await warp(r,p); }
    }
  }
  if(r.fallen){ r.fallen=false; renderBoard(); await banner({r,icon:'🧍',title:`${tag(r)} 일어나는 중`,msg:'넘어져서 이번 기본 이동은 쉬어요',kind:'turn',hits:[r],color:'#999'}); }
  else if(!skip) await basicMove(r);

  if(Math.abs(r.pos-startPos)<=1 && r.laps===G.turnLaps){
    for(const X of orderFrom(r.id)) if(X.card==='booer'){ await act(X,`우~ 야유!|${tag(r)} 제자리걸음 덕분에 ${tag(X)} 2칸 이동 🎉`,[r]); await move(X,2,'ability'); }
  }
  if(!G.extra) G.lastId=r.id;     // 일타선장 보너스 차례는 원래 순서를 건드리지 않음
  G.cur=null;
}

async function basicMove(r){
  let base=null, rocket=false;
  if(r.card==='shoe'){
    const t=all().filter(o=>o!==r && o.pos!==r.pos);
    if(t.length){
      const v=await pickRacer(r,'주사위 대신 위치를 바꿀 선수를 고를까요?',t,'주사위 굴리기');
      if(v){ await act(r,`자리 바꾸기!|${tag(r)} 때문에 ${tag(v)} 자리가 바뀜 😥`,[r,v],'warp'); const a=r.pos; r.pos=v.pos; v.pos=a; renderBoard(); await arrive(r,{moved:false}); await arrive(v,{moved:false}); return; }
    }
  }
  if(r.card==='tall'){ if(await yesno(r,'주사위를 굴리지 않고 5칸 이동할까요?','5칸 이동','주사위 굴리기')){ base=5; await act(r,'성큼성큼!|5칸 이동',[r]); } }

  if(base===null){
    let die=await rollDie(r);
    if(r.card==='magician'){
      for(let i=0;i<2;i++){
        if(await yesno(r,`주사위 <b>${die}</b>! 다시 굴릴까요? (남은 기회 ${2-i}번)`,'다시 굴리기','그대로')){ await act(r,'수리수리!|주사위 다시 굴리기',[r]); die=await rollDie(r); } else break;
      }
    }
    base=die;
    if(r.card==='rocket'){ if(await yesno(r,`주사위 ${die}! <b>${die*2}칸</b>(2배)으로 날아가고 넘어질까요?`,'2배 발사','그대로')){ base=die*2; rocket=true; await act(r,`로켓 발사!|${die*2}칸 이동 (주사위 2배)`,[r]); } }
    let wormed=false;
    for(const X of orderFrom(r.id)){
      if(X.card==='worm' && X!==r && die===1){ wormed=true; await act(X,`꿈틀꿈틀!|${tag(X)} 때문에 ${tag(r)} 기본 이동 못 함 😥 (${tag(X)} 1칸 이동)`,[r,X]); await move(X,1,'ability'); }
      if(X.card==='servant' && X!==r && die===6){ await act(X,`대단해요 주인님!|${tag(r)}의 6 덕분에 ${tag(X)} 먼저 2칸 이동 🎉`,[X]); await move(X,2,'ability'); }
      if(X.card==='captain' && die===1){ G.queue.unshift(X.id); await act(X,'1이 나왔다!|다음 차례도 내 차례 🎉',[X]); }
    }
    if(wormed) return;
  }
  let dist=base;
  if(r.card==='rabbit'){ dist+=2; await act(r,'깡충!|기본 이동 +2',[r]); }
  for(const X of all()){
    if(X.card==='coach' && X.pos===r.pos){ dist+=1; await act(X,`지옥 교관!|${tag(X)} 덕분에 ${tag(r)} 기본 이동 +1 👏`,[r]); }
    if(X.card==='gum' && X!==r){ dist-=1; await act(X,`끈적끈적…|${tag(X)} 때문에 ${tag(r)} 기본 이동 -1 😥`,[r]); }
  }
  dist=Math.max(0,dist);
  log(`${r.name} 기본 이동 ${dist}`);
  if(dist>0){ $('#prompt').innerHTML=`${whoLine(r)}<div class="turnbig">👟 ${dist}칸 이동!</div>`; await sleep(600); }
  G.turnLaps=r.laps;
  await move(r,dist,'basic');
  idlePrompt();
  if(rocket && r.laps===G.turnLaps){ r.fallen=true; await banner({r,icon:'💥',title:`${tag(r)} 착지 실패!`,msg:'로켓 반동으로 넘어짐',kind:'fall',hits:[r],color:'#e8563f'}); }
}

/* ---- 루프 / 되돌리기 ---- */
function snapshot(){ return JSON.stringify({racers:G.racers,queue:G.queue,lastId:G.lastId,log:G.log,lapCnt:G.lapCnt,turnNo:G.turnNo}); }
function restore(s){ Object.assign(G,JSON.parse(s)); G.cur=null; G.hop=null; G.hits=new Set(); G.dirty=false; $('#fx').innerHTML=''; renderAll(); }
function nextRacer(){
  G.extra=false;
  while(G.queue.length){ const q=R(G.queue.shift()); if(!q.done){ G.extra=true; return q; } }
  let i=G.lastId===null?-1:G.seq.indexOf(G.lastId);
  for(let k=0;k<G.seq.length;k++){ i=(i+1)%G.seq.length; const c=R(G.seq[i]); if(!c.done) return c; }
  return R(G.seq[0]);
}
async function raceLoop(){
  if(LOOP_ON) return; LOOP_ON=true;
  while(true){
    G.history.push(snapshot()); if(G.history.length>200) G.history.shift();
    G.dirty=false;
    const r=nextRacer();
    G.turnLaps=r.laps;
    try{ await takeTurn(r); if(G.single && G.racers.every(o=>o.done)){ await pause(900); LOOP_ON=false; showResult(); return; } }
    catch(e){
      const kind=(e instanceof Abort)?e.kind:null;
      ABORT=null; pending=null; $('#fx').innerHTML='';
      if(kind==='undo'){ if(!G.dirty && G.history.length>1) G.history.pop(); restore(G.history.pop()); continue; }
      if(kind==='end'){ LOOP_ON=false; showResult(); return; }
      console.error(e); window.__err=(window.__err||[]).concat(String(e&&e.stack||e)); await pause(400); restore(G.history.pop()||snapshot()); continue;
    }
  }
}
function abortWith(kind){ ABORT=kind; if(pending){ const p=pending; pending=null; p.rej(new Abort(kind)); } }

/* ===================== 경주 화면 ===================== */
function startRace(){
  const racers=Array.from({length:cfg.teams},(_,i)=>({id:i,name:cfg.names[i],color:tcol(i),card:teamCard(i),pos:0,fallen:false,laps:0,score:0}));
  G={racers,seq:ORD.seq,queue:[],lastId:null,log:[],lapCnt:{},turnNo:0,history:[],cur:null,hop:null,hits:new Set(),dirty:false,sigs:new Set(),depth:0,track:cfg.track,star:cfg.star,turnLaps:0,single:(cfg.track!=='hard'||cfg.laps==='one')};
  ABORT=null; pending=null;
  $('#app').innerHTML=`
  <div id="race">
    <div class="top">
      <h1 class="han rainbow">야단법석 달리기</h1>
      <span class="tk">${cfg.track==='hard'?'험난한 험지':'무난한 무대'} · ${G.single?'한 바퀴 · 도착 순서대로':'한 바퀴마다'} 100·90·80…점</span>
      <span class="sp"></span>
      <button class="btn sm ghost" onclick="abortWith('undo')">↩ 되돌리기</button>
      <button class="btn sm ghost" onclick="openAdjust()">✋ 수동 조정</button>
      <button class="btn sm ghost" id="sndBtn" onclick="cfg.sound=!cfg.sound;saveCfg();this.textContent=cfg.sound?'🔊 소리':'🔇 소리'">${cfg.sound?'🔊 소리':'🔇 소리'}</button>
      <button class="btn sm ghost" onclick="speedToggle(this)">⏩ ${speedLabel()}</button>
      <button class="btn sm re" onclick="confirmEnd()">⏹ 수업 끝 · 점수 계산</button>
    </div>
    <div class="board" id="board"></div>
    <div class="teams" id="teams"></div>
  </div>`;
  buildBoard(); renderAll();
  (async()=>{
    sfx.start();
    for(const t of ['3','2','1','출발!']){ $('#prompt').innerHTML=`<div class="turnbig" style="font-size:${t.length>1?10:14}vh">${t}</div>`; await pause(550); }
    raceLoop();
  })();
}
const SPEEDS=[[2.4,'느리게'],[1.6,'보통'],[1,'빠르게']];
function speedLabel(){ return (SPEEDS.find(x=>x[0]===cfg.speed)||SPEEDS[1])[1]; }
function speedToggle(b){ const i=SPEEDS.findIndex(x=>x[0]===cfg.speed); cfg.speed=SPEEDS[(i+1)%3][0]; b.textContent='⏩ '+speedLabel(); saveCfg(); }

function cellRC(p){ if(p===0) return [1,2]; if(p<=13) return [1,p+2]; if(p===14) return ['2 / 4',15]; return [4,30-p]; }
function buildBoard(){
  let h=`<div class="finish"><div class="tro">🏆</div><div class="lbl">결승</div></div>`;
  for(let p=0;p<FINISH;p++){
    const [rr,cc]=cellRC(p);
    let fx='',fcls='';
    if(G.track==='hard' && HARD[p]){
      const f=HARD[p];
      if(f.t==='fall'){ fx='<span>💫 넘어짐</span>'; fcls='fl'; }
      else if(f.t==='star'){ if(G.star==='bonus'){ fx='<span>⭐ +20점</span>'; fcls='st'; } }
      else if(f.n>0){ fx=`<span>▶ +${f.n}칸</span>`; fcls='fw'; }
      else { fx=`<span>◀ ${f.n}칸</span>`; fcls='bk'; }
    }
    const corner=p===13?'c-tr':p===15?'c-br':p===29?'c-bl':'';
    h+=`<div class="cell ${p===0?'start':''} ${corner} ${fcls}" style="grid-row:${rr};grid-column:${cc};${p?`background:${SQ[(p-1)%5]}`:''}">
      <span class="no">${p===0?'시작':p}</span>${fx?`<div class="badge">${fx}</div>`:''}<div class="toks" id="c${p}"></div></div>`;
  }
  h+=`<div class="center"><div id="prompt"></div></div>`;
  $('#board').innerHTML=h;
}
function renderBoard(){
  if(!$('#board')) return;
  for(let p=0;p<FINISH;p++){ const el=$('#c'+p); if(el) el.innerHTML=''; }
  for(let p=0;p<FINISH;p++){ const el=$('#c'+p); if(!el) continue; const n=all().filter(o=>Math.min(o.pos,FINISH-1)===p).length; el.style.setProperty('--ts',n>=5?'2.8vh':n>=3?'3.6vh':n===2?'4.5vh':'5.4vh'); el.style.setProperty('--tf',n>=5?'1.9vh':n>=3?'2.4vh':n===2?'2.9vh':'3.5vh'); el.parentElement.classList.toggle('curcell',G.cur!=null && all().some(o=>o.id===G.cur && Math.min(o.pos,FINISH-1)===p)); }
  for(const r of all()){
    const el=$('#c'+Math.min(r.pos,FINISH-1)); if(!el) continue;
    const cls=[r.fallen?'fallen':'',G.cur===r.id?'cur':'',G.hop===r.id?'hop':'',G.hits&&G.hits.has(r.id)?'hit':''].join(' ');
    el.insertAdjacentHTML('beforeend',`<div class="tok ${cls}" style="background:${r.color}">${r.id+1}</div>`);
  }
  renderTeams();
}
function renderTeams(){
  const el=$('#teams'); if(!el) return;
  el.innerHTML=G.racers.map(r=>{
    const c=CARD[r.card];
    return `<div class="tcard ${G.cur===r.id?'cur':''}" style="border-left:.9vh solid ${r.color}">
      <div class="tn">${numBadge(r.id)}${esc(r.name)}${G.cur===r.id?'<span class="now">▶ 지금 차례</span>':''}<span class="sc">${r.score}<small>점</small></span></div>
      <div class="cn">${c.e} ${c.name}</div><div class="ct">${c.t}</div>
      <div class="st">${r.done?'🏁 완주!':`🏁 ${r.laps}바퀴 · ${posName(r.pos)}${r.fallen?' · 💫넘어짐':''}`}</div></div>`;}).join('');
}
function renderLog(){}
function renderAll(){ renderBoard(); }

/* ---- 수동 조정 / 종료 ---- */
function openAdjust(){
  const rows=G.racers.map(r=>`<div>${tag(r)} · ${posName(r.pos)} · <b>${r.score}점</b></div>
     <button class="btn sm ghost" onclick="adj(${r.id},-1)">−1칸</button>
     <button class="btn sm ghost" onclick="adj(${r.id},1)">+1칸</button>
     <button class="btn sm ${r.fallen?'ye':'ghost'}" onclick="adjFall(${r.id})">${r.fallen?'💫 넘어짐':'서 있음'}</button>
     <button class="btn sm ghost" onclick="adjScore(${r.id},-10)">−10점</button>
     <button class="btn sm ghost" onclick="adjScore(${r.id},10)">+10점</button>`).join('');
  $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box">
    <h3>✋ 수동 조정</h3><div class="note">규칙 다툼이나 실수가 있을 때 직접 고쳐요. (능력은 발동되지 않아요)</div>
    <div class="adj">${rows}</div><div class="foot"><button class="btn pk" onclick="closeModal()">닫기</button></div></div></div>`;
}
function adj(id,d){ const r=R(id); r.pos=Math.max(0,Math.min(FINISH-1,r.pos+d)); renderBoard(); openAdjust(); }
function adjFall(id){ const r=R(id); r.fallen=!r.fallen; renderBoard(); openAdjust(); }
function adjScore(id,d){ const r=R(id); r.score=Math.max(0,r.score+d); renderBoard(); openAdjust(); }
function closeModal(){ $('#modal').innerHTML=''; }
function confirmEnd(){
  $('#modal').innerHTML=`<div class="modal"><div class="box"><h3>⏹ 수업 끝! 여기서 그만할까요?</h3>
    <p style="font-size:1.15rem;line-height:1.5">지금까지 모은 점수로 최종 순위를 보여줘요. 점수가 같으면 많이 달린 모둠(바퀴 수 → 현재 칸)이 앞서요.</p>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">계속하기</button><button class="btn re" onclick="closeModal();abortWith('end')">그만하고 점수 보기</button></div></div></div>`;
}

/* ===================== 5. 결과 ===================== */
function showResult(){
  const prog=r=>r.laps*FINISH+r.pos;
  const list=[...G.racers].sort((a,b)=>b.score-a.score||prog(b)-prog(a));
  let rank=0, prev=null;
  const rows=list.map((r,i)=>{ const key=r.score+'/'+prog(r); if(key!==prev){ rank=i+1; prev=key; } return {r,rank}; });
  const medal=k=>k===1?'🥇':k===2?'🥈':k===3?'🥉':'';
  sfx.end();
  $('#app').innerHTML=`<div class="wrap" style="text-align:center">
    <h1 class="screen-title rainbow">최종 점수</h1>
    <p class="sub">${G.single?'도착한 순서대로':'한 바퀴 완주할 때마다 들어온 순서대로'} 100·90·80…점</p>
    <div class="podium">${rows.map(({r,rank})=>`<div class="prow ${rank===1?'r1':''}"><span class="rk">${medal(rank)}${rank}등</span>
      ${numBadge(r.id)}<b style="color:${r.color}">${esc(r.name)}</b><span>${CARD[r.card].e} ${CARD[r.card].name}</span><span style="flex:1"></span>
      <span style="color:var(--dim);font-size:1.05rem">${r.done?'완주':r.laps+'바퀴 · '+posName(r.pos)}</span><span class="pts">${r.score}점</span></div>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="btn ghost" onclick="showSetup()">⚙️ 처음으로</button>
      <button class="btn pk" style="font-size:1.2rem" onclick="startDraft()">🔀 새 카드로 다시 하기</button>
    </div></div>`;
}

showSetup();
</script>
</body>
